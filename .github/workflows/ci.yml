name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -m "not network"
      - name: walking skeleton demo
        run: python -m clickless plan --no-input "From Phoenix to Flagstaff in my Spark LR, I have 65% battery, lunch stop"
