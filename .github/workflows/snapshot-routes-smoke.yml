# Smoke test for "snapshot routes" (issues #36, #103), on pull requests that change it: builds the
# routes of three real benchmark items through the public OSRM server from a GitHub runner, adds them
# to the published snapshot with add_routes, then geocodes two places the snapshot lacks (Nominatim,
# add_places) and routes them too. Comments the result on the PR. Publishes nothing.
name: snapshot routes smoke

on:
  pull_request:
    paths:
      - scripts/build_route_cache.py
      - src/clickless/data/add_routes.py
      - src/clickless/data/add_places.py
      - src/clickless/data/geocode.py
      - .github/workflows/snapshot-routes*.yml

permissions:
  contents: read
  pull-requests: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash  # -eo pipefail: a failing command fails the step even when piped into tee
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Download the snapshot
        run: |
          gh release download snapshot-v1-draft --pattern '*.zip' --dir downloaded
          mkdir -p data/snapshot && unzip -q -o downloaded/*.zip -d data/snapshot
          python -m clickless.data.snapshot_report --verify-only
      - name: Three real routes, end to end
        run: |
          mkdir -p smoke-items && head -n 4 benchmark/requests/raw/aarya.jsonl > smoke-items/aarya.jsonl
          python scripts/build_route_cache.py --snapshot-dir data/snapshot --raw-dir smoke-items 2>&1 | tee smoke.log
          python -m clickless.data.add_routes --dir data/snapshot 2>&1 | tee -a smoke.log
          python -m clickless.data.snapshot_report --verify-only 2>&1 | tee -a smoke.log
          python - <<'PY' | tee -a smoke.log
          import json
          from clickless.config import load_config
          from clickless.data.loaders import DataStore
          from clickless.planning.routing import CachedRouter
          r = json.load(open("data/snapshot/MANIFEST.json"))["sources"]["routes"]
          print("sources.routes:", {k: r[k] for k in ("files", "distinct_routes", "sources", "osrm_server", "pairs_failed")})
          store = DataStore.from_dir("data/snapshot")
          meta = json.load(open(next(__import__("pathlib").Path("data/snapshot/routes").glob("*.json"))))["_meta"]
          o, d = store.geocode(meta["origin_text"]), store.geocode(meta["destination_text"])
          route = CachedRouter(store, load_config("A")["energy"]).route(o, d)
          print(f"CachedRouter: {o.text} -> {d.text}: {route.distance_km:.0f} km, {route.duration_min:.0f} min, "
                f"{len(route.geometry)} points, source {route.provenance.source}")
          PY
      - name: Two new places, geocoded then routed
        run: |
          mkdir -p smoke-places
          echo '{"id": "smoke-001", "author": "manas", "category": "rural", "route_type": "rural", "text": "smoke", "gold_request": {"origin": "Bangor, ME", "destination": "Bar Harbor, ME", "vehicle_id": "tesla-model-3-rwd-2024", "start_soc_pct": 50}, "clarification_required": false}' > smoke-places/manas.jsonl
          python -m clickless.data.add_places --dir data/snapshot --benchmark-dir smoke-places --fix-area-matches --fix-district-matches 2>&1 | tee -a smoke.log
          python scripts/build_route_cache.py --snapshot-dir data/snapshot --raw-dir smoke-places 2>&1 | tail -n 6 | tee -a smoke.log
          python -m clickless.data.add_routes --dir data/snapshot 2>&1 | tee -a smoke.log
          python -m clickless.data.snapshot_report --verify-only 2>&1 | tee -a smoke.log
          python - <<'PY' | tee -a smoke.log
          import json
          from clickless.config import load_config
          from clickless.data.loaders import DataStore
          from clickless.planning.routing import CachedRouter
          print("sources.places:", {k: v for k, v in json.load(open("data/snapshot/MANIFEST.json"))["sources"]["places"].items()
                                    if k in ("requested", "resolved", "added")})
          for f in json.load(open("data/snapshot/MANIFEST.json"))["sources"]["places"].get("refreshed", []):
              print(f"re-geocoded {f['place']}: {f['was_at']} -> {f['now_at']} ({f['now']}) {f.get('fallback', '')}")
          store = DataStore.from_dir("data/snapshot")
          o, d = store.geocode("Bangor, ME"), store.geocode("Bar Harbor, ME")
          print(f"geocode: {o.text} -> ({o.lat}, {o.lon}); {d.text} -> ({d.lat}, {d.lon})")
          route = CachedRouter(store, load_config("A")["energy"]).route(o, d)
          print(f"CachedRouter: {o.text} -> {d.text}: {route.distance_km:.0f} km, {route.duration_min:.0f} min, "
                f"{len(route.geometry)} points, source {route.provenance.source}")
          PY
      - name: "TEMP (#122): Nominatim top 5 for district and city queries"
        run: |
          python - <<'PY' | tee -a smoke.log
          import json, time, requests
          from clickless.data.geocode import NOMINATIM_URL, USER_AGENT
          qs = ["Downtown Denver, CO", "Downtown, Denver, CO", "Denver, CO",
                "Old Town Scottsdale, AZ", "Old Town, Scottsdale, AZ", "Scottsdale, AZ",
                "Downtown Detroit, MI", "Downtown, Detroit, MI", "Downtown Minneapolis, MN", "Downtown, Minneapolis, MN",
                "Downtown Seattle, WA", "Downtown, Seattle, WA",
                "San Francisco, CA", "Nashville, TN", "Indianapolis, IN", "Philadelphia, PA"]
          for q in qs:
              r = requests.get(NOMINATIM_URL, params={"q": q, "format": "jsonv2", "limit": 5, "countrycodes": "us"},
                               headers={"User-Agent": USER_AGENT}, timeout=60).json()
              print(f"## {q}")
              for h in r:
                  print(f"   {h.get('addresstype')!s:14} rank={h.get('place_rank')!s:3} {h.get('category')}/{h.get('type')}  "
                        f"{float(h['lat']):.4f},{float(h['lon']):.4f}  {h['display_name'][:70]}")
              time.sleep(1.2)
          PY
      - name: Comment the result on the PR
        if: always()
        run: |
          {
            echo "**snapshot routes smoke test** (run ${{ github.run_id }}, ${{ job.status }}): 3 real benchmark items via OSRM, then 2 new places via Nominatim + OSRM, from a GitHub runner"
            echo '```'
            tail -n 140 smoke.log 2>/dev/null || echo "no log"
            echo '```'
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
