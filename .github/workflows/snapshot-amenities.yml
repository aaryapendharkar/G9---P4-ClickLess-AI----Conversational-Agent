# Adds OpenStreetMap amenities to the stations-only snapshot on GitHub's servers and publishes the
# result as a pre-release (issue #36). Owner: Aarya. Run it from the Actions tab: "snapshot amenities"
# -> "Run workflow". No API key is needed: stations come from the published stations-only release.
#
# plan:    exact download links of every US state/territory extract, from Geofabrik's index
# match:   8 machines in parallel, each downloads its extracts, keeps the amenity tags (osmium) and
#          matches them to the stations (python -m clickless.data.osm_extract match)
# publish: merges all matches into the snapshot (add_amenities --from-raw) and publishes the release
# If one machine fails, use "Re-run failed jobs": finished groups keep their results.
name: snapshot amenities

on:
  workflow_dispatch:
    inputs:
      source_release:
        description: "Release with the stations-only snapshot zip"
        default: snapshot-v1-draft-stations
        required: true
      target_release:
        description: "Release to publish the snapshot with amenities to"
        default: snapshot-v1-draft
        required: true
      groups:
        description: "Machines working in parallel"
        default: "8"
        required: true

permissions:
  contents: write  # publish the release

concurrency:
  group: snapshot-amenities
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - id: plan
        name: List the US extracts
        run: |
          python -m clickless.data.osm_extract regions --groups "${{ inputs.groups }}" > matrix.json
          python -c "import json; m = json.load(open('matrix.json')); print(sum(len(g['urls'].split()) for g in m['include']), 'extracts in', len(m['include']), 'groups')"
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"

  match:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: match (group ${{ matrix.group }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Install osmium
        run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool && osmium --version
      - name: Download the stations-only snapshot
        run: |
          gh release download "${{ inputs.source_release }}" --pattern '*.zip' --dir downloaded
          mkdir -p data/snapshot && unzip -q -o downloaded/*.zip -d data/snapshot
          python -m clickless.data.snapshot_report --verify-only
      - name: Download, filter and match the extracts
        run: .github/scripts/osm-extract-amenities.sh data/snapshot ${{ matrix.urls }}
      - uses: actions/upload-artifact@v4
        with:
          name: osm-extract-${{ matrix.group }}
          path: data/raw/osm/extract_*.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: match
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Download the stations-only snapshot
        run: |
          gh release download "${{ inputs.source_release }}" --pattern '*.zip' --dir downloaded
          mkdir -p data/snapshot && unzip -q -o downloaded/*.zip -d data/snapshot
          python -m clickless.data.snapshot_report --verify-only
      - uses: actions/download-artifact@v4
        with:
          pattern: osm-extract-*
          path: data/raw/osm
          merge-multiple: true
      - name: Add the amenities to the snapshot
        run: |
          echo "$(ls data/raw/osm/extract_*.json | wc -l) extracts matched"
          python -m clickless.data.add_amenities --dir data/snapshot --from-raw data/raw/osm/extract_*.json
      - name: Report and zip
        run: |
          python -m clickless.data.snapshot_report --pack "results/${{ inputs.target_release }}.zip" --out results/snapshot-report.md
          {
            echo "**Draft snapshot with amenities. Not frozen.** Issue #36."
            echo
            echo "Built by the \`snapshot amenities\` workflow (run ${{ github.run_id }}) from \`${{ inputs.source_release }}\` + OpenStreetMap amenities from Geofabrik's US state extracts (osmium). Stations, vehicles and places are unchanged from \`${{ inputs.source_release }}\`. OSM data © OpenStreetMap contributors, ODbL."
            echo
            echo "Use: unzip into \`data/snapshot/\`, run \`make snapshot-verify\` (expect \`[] (intact)\`), then run with \`CLICKLESS_DATA_SOURCE=snapshot\`."
            echo
            echo "zip SHA-256: \`$(sha256sum "results/${{ inputs.target_release }}.zip" | cut -d' ' -f1)\`"
            echo
            sed 's/^## Snapshot report/### Snapshot report/' results/snapshot-report.md
          } > results/release-notes.md
      - name: Publish the release
        run: |
          tag="${{ inputs.target_release }}"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "results/$tag.zip" results/snapshot-report.md --clobber
            gh release edit "$tag" --notes-file results/release-notes.md
          else
            gh release create "$tag" "results/$tag.zip" results/snapshot-report.md \
              --prerelease --target "${{ github.sha }}" \
              --title "Snapshot v1 draft (stations + amenities)" --notes-file results/release-notes.md
          fi
          echo "::notice title=Snapshot published::https://github.com/${{ github.repository }}/releases/tag/$tag"
