# Smoke test for "snapshot amenities" (issue #36), on pull requests that change it:
#  1. builds the same plan as the real run (US extract links from Geofabrik's index, in groups) and
#     checks that every link exists;
#  2. runs one small state (Delaware) end to end with the same script against the published
#     stations-only snapshot.
# Posts the result as a PR comment. Publishes nothing.
name: snapshot amenities smoke

on:
  pull_request:
    paths:
      - src/clickless/data/osm_extract.py
      - src/clickless/data/add_amenities.py
      - .github/scripts/osm-extract-amenities.sh
      - .github/workflows/snapshot-amenities*.yml

permissions:
  contents: read
  pull-requests: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool && osmium --version
      - name: Plan, and check every extract link
        run: |
          python -m clickless.data.osm_extract regions --groups 8 > matrix.json
          python - <<'PY' | tee smoke.log
          import json, subprocess
          m = json.load(open("matrix.json"))
          urls = [u for g in m["include"] for u in g["urls"].split()]
          missing = [u for u in urls if subprocess.run(
              ["curl", "-sfIL", "--retry", "3", "--max-time", "60", "-o", "/dev/null", u]).returncode != 0]
          print(f"plan: {len(urls)} extracts in {len(m['include'])} groups; first: {urls[0]}; last: {urls[-1]}")
          print(f"links checked: {len(urls) - len(missing)} ok, {len(missing)} missing {missing}")
          if missing:
              print(f"::error title=Extract links::missing: {missing}")
              raise SystemExit(1)
          PY
      - name: Download the stations-only snapshot
        run: |
          gh release download snapshot-v1-draft-stations --pattern '*.zip' --dir downloaded
          mkdir -p data/snapshot && unzip -q -o downloaded/*.zip -d data/snapshot
          python -m clickless.data.snapshot_report --verify-only
      - name: Delaware end to end
        run: |
          url=$(python -c "import json; print(next(u for g in json.load(open('matrix.json'))['include'] for u in g['urls'].split() if u.endswith('/delaware-latest.osm.pbf')))")
          .github/scripts/osm-extract-amenities.sh data/snapshot "$url" 2>&1 | tee -a smoke.log
          python -m clickless.data.add_amenities --dir data/snapshot --from-raw data/raw/osm/extract_*.json 2>&1 | tee -a smoke.log
          python -m clickless.data.snapshot_report --dir data/snapshot > report.md
          python - <<'PY' >> smoke.log
          from collections import Counter
          from clickless.data.loaders import DataStore
          s = DataStore.from_dir("data/snapshot")
          print("amenities by category:", dict(Counter(a.category.value for a in s.amenities)))
          print("sample:", [(a.amenity_id, a.name, a.category.value) for a in s.amenities[:4]])
          PY
      - name: Comment the result on the PR
        if: always()
        run: |
          {
            echo "**snapshot amenities smoke test** (run ${{ github.run_id }}, ${{ job.status }}): plan + link check + Delaware end to end"
            echo '```'
            tail -n 40 smoke.log 2>/dev/null || echo "no log"
            echo '```'
            grep -E "verify_manifest|amenities \||Blocking" report.md 2>/dev/null || true
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
